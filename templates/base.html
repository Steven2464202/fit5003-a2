<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>DevBank</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 2rem auto; }
    nav a { margin-right: 1rem; }
    .banner { background:#eef; padding:.4rem .8rem; border-radius:6px; font-size:.85rem; }
    .card { border:1px solid #ccc; border-radius:8px; padding:1rem; margin:1rem 0; }
    input { padding:.3rem; }
    .err { color:#b00; }
  </style>
</head>
<body>
  <div class="banner">DevBank demo — student: {{ student_id }}</div>
  {% if session_user %}
  <nav>
    <a href="/dashboard">Dashboard</a>
    <a href="/search">Search</a>
    <a href="/profile">Profile</a>
    <a href="/api/account">Account API</a>
    <a href="/logout">Log out</a>
  </nav>
  {% endif %}
  {% block body %}{% endblock %}
</body>
</html>
