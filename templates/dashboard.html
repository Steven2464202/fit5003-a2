{% extends "base.html" %}
{% set session_user = me["username"] %}
{% block body %}
<h1>Welcome, {{ me["username"] }}</h1>
<div class="card">
  <p><strong>Balance:</strong> ${{ me["balance"] }} &nbsp; <strong>Email:</strong> {{ me["email"] }}</p>
</div>

<div class="card">
  <h2>Transfer money</h2>
  <form method="POST" action="/transfer">
    <p>To: <input name="to" placeholder="username"></p>
    <p>Amount: <input name="amount" type="number" value="1"></p>
    <p><button type="submit">Send</button></p>
  </form>
</div>

<div class="card">
  <h2>Your notes</h2>
  {% for note in notes %}
    <div>{{ note["content"] | safe }}</div>
  {% endfor %}
  <form method="POST" action="/note">
    <p><input name="content" placeholder="new note" size="50"></p>
    <p><button type="submit">Add note</button></p>
  </form>
</div>
{% endblock %}
