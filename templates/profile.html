{% extends "base.html" %}
{% set session_user = me["username"] %}
{% block body %}
<h1>Your profile</h1>
<div class="card">
  <p><strong>Username:</strong> {{ me["username"] }}</p>
  <p><strong>Email:</strong> {{ me["email"] }}</p>
  <form method="POST" action="/profile">
    <p>New email: <input name="email" value="{{ me['email'] }}"></p>
    <p>New password: <input name="password" type="password" placeholder="leave blank to keep"></p>
    <p><button type="submit">Update profile</button></p>
  </form>
</div>
{% endblock %}
